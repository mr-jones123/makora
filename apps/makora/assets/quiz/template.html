<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="color-scheme" content="light dark">
<title>makora quiz</title>
<style>
:root {
	--bg: #f7f5f0;
	--card: #ffffff;
	--ink: #1d1b16;
	--muted: #6b665c;
	--line: #e3ded3;
	--accent: #9a6b16;
	--accent-soft: #f3e7cf;
	--good: #1f7a3f;
	--good-soft: #e3f3e8;
	--bad: #b3261e;
	--bad-soft: #fbe6e4;
	--add: #e6f4ea;
	--add-ink: #1a5e32;
	--del: #fdecea;
	--del-ink: #8c1d18;
	--hunk: #eef1f8;
	--hunk-ink: #3d4f7a;
	--mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
	--sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #15140f;
		--card: #1e1c17;
		--ink: #ece7dc;
		--muted: #a39c8d;
		--line: #34312a;
		--accent: #d9a648;
		--accent-soft: #3a2f1a;
		--good: #6fcf8f;
		--good-soft: #1b3324;
		--bad: #f08a80;
		--bad-soft: #3d1f1c;
		--add: #17301f;
		--add-ink: #8fdca8;
		--del: #3a1c1a;
		--del-ink: #f2a39b;
		--hunk: #1f2535;
		--hunk-ink: #9fb2e0;
	}
}
* { box-sizing: border-box; }
html { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
body { margin: 0; }
main { max-width: 900px; margin: 0 auto; padding: 32px 20px 96px; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 4px 0 8px; }
h2 { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 40px 0 12px; }
code, .mono { font-family: var(--mono); font-size: 0.88em; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
.eyebrow { margin: 0; color: var(--accent); font-weight: 600; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); margin: 0; }
.meta b { color: var(--ink); font-weight: 600; }
ins { color: var(--good); text-decoration: none; }
del { color: var(--bad); text-decoration: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.commits, .decisions { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.commit { overflow: hidden; scroll-margin-top: 16px; }
.commit-head { width: 100%; display: grid; grid-template-columns: 18px auto 1fr auto; gap: 4px 10px; align-items: baseline; padding: 12px 14px 4px; background: none; border: 0; text-align: left; cursor: pointer; }
.commit-head:hover .subject { text-decoration: underline; }
.chevron { color: var(--muted); transition: transform 0.15s; display: inline-block; }
.commit[data-open] .chevron { transform: rotate(90deg); }
.sha { color: var(--accent); }
.subject { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.stat { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
.summary { margin: 0; padding: 0 14px 12px 42px; color: var(--muted); }
.files { border-top: 1px solid var(--line); padding: 8px 10px 10px; display: grid; gap: 6px; }
.file { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.file > summary { cursor: pointer; padding: 6px 10px; display: flex; gap: 10px; align-items: baseline; font-size: 0.88rem; }
.file > summary .path { flex: 1; min-width: 0; overflow-wrap: anywhere; font-family: var(--mono); }
.badge { font-family: var(--mono); font-size: 0.75rem; padding: 0 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.diff { margin: 0; overflow-x: auto; font: 12.5px/1.45 var(--mono); border-top: 1px solid var(--line); }
.row { display: flex; min-width: max-content; }
.row .ln { flex: none; width: 4.5ch; padding-right: 1ch; text-align: right; color: var(--muted); opacity: 0.7; user-select: none; }
.row .code { white-space: pre; padding: 0 10px 0 4px; }
.row.hunk .code, .row.gap .code { padding-left: 10px; }
.row.add { background: var(--add); color: var(--add-ink); }
.row.del { background: var(--del); color: var(--del-ink); }
.row.hunk { background: var(--hunk); color: var(--hunk-ink); }
.row.gap { color: var(--muted); font-style: italic; }
.row.noted { box-shadow: inset 4px 0 0 var(--accent); background: var(--accent-soft); color: var(--ink); }
.note-box { margin: 0; padding: 10px 14px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--card); font-size: 0.92rem; scroll-margin-top: 80px; }
.note-box p { margin: 2px 0 6px; overflow-wrap: anywhere; }
.note-box code { font-size: 0.85em; padding: 0 4px; border-radius: 4px; background: var(--accent-soft); }
.note-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.notes-badge { font-size: 0.72rem; font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.aside { padding: 6px 10px; color: var(--muted); font-size: 0.85rem; font-style: italic; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 40px 0 12px; }
.section-head h2 { margin: 0; }
.small { padding: 4px 12px; font-size: 0.85rem; }
.flash { outline: 2px solid var(--accent); }
.decision { padding: 12px 14px; scroll-margin-top: 16px; }
.decision strong { display: block; }
.decision span { color: var(--muted); }
.questions { display: grid; gap: 14px; }
.question { margin: 0; padding: 16px 16px 14px; min-width: 0; }
.question legend { float: left; width: 100%; padding: 0; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.question .prompt { clear: both; margin: 0 0 12px; font-weight: 600; font-size: 1.05rem; }
.tag { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.options { display: grid; gap: 8px; }
.option { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.option:hover { border-color: var(--accent); }
.option input { margin: 4px 0 0; accent-color: var(--accent); }
.option.is-correct { border-color: var(--good); background: var(--good-soft); }
.option.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.scored .option { cursor: default; }
.feedback { margin-top: 12px; padding: 10px 12px; border-radius: 8px; border-left: 4px solid var(--line); background: var(--bg); }
.feedback.good { border-left-color: var(--good); }
.feedback.bad { border-left-color: var(--bad); }
.feedback p { margin: 0 0 6px; }
.verdict { font-weight: 700; }
.good .verdict { color: var(--good); }
.bad .verdict { color: var(--bad); }
.cites { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; font-size: 0.85rem; color: var(--muted); }
.cites a, .cites code { padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); }
.cites a { text-decoration: none; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 20px; }
.primary, .secondary { border-radius: 8px; padding: 10px 20px; cursor: pointer; font-weight: 600; }
.primary { background: var(--accent); color: var(--card); border: 0; }
.secondary { background: none; border: 1px solid var(--accent); color: var(--accent); }
.progress { color: var(--muted); font-size: 0.9rem; }
.results { margin-top: 24px; padding: 18px; scroll-margin-top: 16px; }
.score { font-size: 1.5rem; font-weight: 700; margin: 0; }
.grade-line { margin: 2px 0 12px; color: var(--muted); }
.board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin: 12px 0; }
.board a { text-align: center; text-decoration: none; padding: 6px 0; border-radius: 6px; font-weight: 700; font-size: 0.85rem; }
.board .right { background: var(--good-soft); color: var(--good); }
.board .wrong { background: var(--bad-soft); color: var(--bad); }
.review h3 { font-size: 1rem; margin: 18px 0 8px; }
.review ol { margin: 0; padding-left: 22px; display: grid; gap: 12px; }
.review li p { margin: 0 0 4px; }
.weak { margin: 8px 0 0; color: var(--muted); }
@media (max-width: 600px) {
	main { padding: 20px 12px 72px; }
	h1 { font-size: 1.5rem; }
	.commit-head { grid-template-columns: 18px 1fr; }
	.commit-head .subject { grid-column: 2; }
	.commit-head .stat { grid-column: 2; white-space: normal; }
	.summary { padding-left: 42px; }
	.board { grid-template-columns: repeat(5, 1fr); }
}
</style>
</head>
<body>
<main>
	<header>
		<p class="eyebrow">makora · session quiz</p>
		<h1 id="project"></h1>
		<p class="meta" id="meta"></p>
	</header>
	<section aria-labelledby="changes-title">
		<div class="section-head">
			<h2 id="changes-title">What changed</h2>
			<button type="button" class="secondary small" id="notes-toggle" aria-pressed="false" hidden>Expand all notes</button>
		</div>
		<ol class="commits" id="commits"></ol>
	</section>
	<section aria-labelledby="decisions-title">
		<h2 id="decisions-title">Decisions</h2>
		<ol class="decisions" id="decisions"></ol>
	</section>
	<section aria-labelledby="questions-title">
		<h2 id="questions-title">Questions</h2>
		<form class="questions" id="questions"></form>
		<div class="actions">
			<button type="button" class="primary" id="submit">Submit all</button>
			<button type="button" class="secondary" id="retake" hidden>Retake</button>
			<span class="progress" id="progress"></span>
		</div>
		<div class="card results" id="results" hidden></div>
	</section>
</main>
<script id="quiz-data" type="application/json">__MAKORA_QUIZ_DATA__</script>
<script>
"use strict";
const quiz = JSON.parse(document.getElementById("quiz-data").textContent);
const GRADES = [
	[9, "Mastered", "Excellent understanding."],
	[7, "Proficient", "Good grasp, minor gaps."],
	[5, "Developing", "Fundamentals understood, needs review."],
	[3, "Beginning", "Significant gaps, review recommended."],
	[0, "Not yet", "Start again from what changed."],
];

function el(tag, attributes, ...children) {
	const node = document.createElement(tag);
	for (const [name, value] of Object.entries(attributes || {})) {
		if (value === false || value === undefined) continue;
		if (name.startsWith("on")) node.addEventListener(name.slice(2), value);
		else node.setAttribute(name, value === true ? "" : String(value));
	}
	for (const child of children.flat()) {
		if (child === undefined || child === null || child === false) continue;
		node.append(typeof child === "string" || typeof child === "number" ? document.createTextNode(String(child)) : child);
	}
	return node;
}

const shortSha = (sha) => sha.slice(0, 7);
const count = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const day = (ms) => new Date(ms).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
const stat = (added, removed) => [el("ins", {}, `+${added}`), " ", el("del", {}, `\u2212${removed}`)];

function header() {
	document.title = `${quiz.project} quiz \u00b7 ${quiz.range}`;
	document.getElementById("project").textContent = quiz.project;
	const added = quiz.commits.reduce((sum, commit) => sum + commit.added, 0);
	const removed = quiz.commits.reduce((sum, commit) => sum + commit.removed, 0);
	const first = quiz.commits[0];
	const last = quiz.commits[quiz.commits.length - 1];
	const dates = first === undefined ? "" : day(first.date) === day(last.date) ? day(first.date) : `${day(first.date)} \u2013 ${day(last.date)}`;
	document.getElementById("meta").append(
		el("span", {}, el("code", {}, quiz.range)),
		el("span", {}, dates),
		el("span", {}, el("b", {}, count(quiz.commits.length, "commit"))),
		el("span", {}, stat(added, removed), " lines"),
	);
}

const commitViews = [];
const noteHomes = new Map();

function commits() {
	const list = document.getElementById("commits");
	quiz.commits.forEach((commit, commitIndex) => {
		const notes = commit.files.reduce((sum, file) => sum + file.notes.length, 0);
		// Annotated files come first and open with their commit.
		const files = commit.files.map((file, fileIndex) => ({ file, fileIndex })).sort((a, b) => Number(b.file.notes.length > 0) - Number(a.file.notes.length > 0));
		const box = el("div", { class: "files", hidden: true });
		const head = el(
			"button",
			{ type: "button", class: "commit-head", "aria-expanded": "false" },
			el("span", { class: "chevron", "aria-hidden": "true" }, "\u25b8"),
			el("code", { class: "sha" }, shortSha(commit.sha)),
			el("span", { class: "subject" }, commit.subject),
			el("span", { class: "stat" }, stat(commit.added, commit.removed), ` \u00b7 ${count(commit.files.length, "file")}`, notes > 0 ? [" ", el("span", { class: "notes-badge" }, count(notes, "note"))] : ""),
		);
		const row = el("li", { class: "card commit", id: `commit-${shortSha(commit.sha)}` }, head, el("p", { class: "summary" }, commit.summary), box);
		const view = { commit, row, head, box, files, notes, fileViews: new Map() };
		commitViews.push(view);
		for (const { file, fileIndex } of files) for (const note of file.notes) noteHomes.set(note.index, { view, fileIndex });
		head.addEventListener("click", () => setOpen(view, !row.hasAttribute("data-open")));
		list.append(row);
	});
	const annotated = commitViews.filter((view) => view.notes > 0);
	const toggle = document.getElementById("notes-toggle");
	if (annotated.length === 0) return;
	toggle.hidden = false;
	toggle.addEventListener("click", () => {
		const expand = toggle.getAttribute("aria-pressed") !== "true";
		for (const view of annotated) setOpen(view, expand);
		toggle.setAttribute("aria-pressed", String(expand));
		toggle.textContent = expand ? "Collapse all notes" : "Expand all notes";
	});
}

function setOpen(view, open) {
	view.row.toggleAttribute("data-open", open);
	view.head.setAttribute("aria-expanded", String(open));
	view.box.hidden = !open;
	if (!open || view.box.childElementCount > 0) return;
	if (view.files.length === 0) view.box.append(el("div", { class: "aside" }, "No file changes."));
	for (const { file, fileIndex } of view.files) {
		const fileView = makeFileView(file);
		view.fileViews.set(fileIndex, fileView);
		view.box.append(fileView.details);
		if (file.notes.length > 0) fileView.open();
	}
}

function makeFileView(file) {
	const name = file.oldPath === undefined ? file.path : `${file.oldPath} \u2192 ${file.path}`;
	const details = el(
		"details",
		{ class: "file" },
		el(
			"summary",
			{},
			el("span", { class: "badge" }, file.status),
			el("span", { class: "path" }, name),
			file.notes.length > 0 ? el("span", { class: "notes-badge" }, count(file.notes.length, "note")) : "",
			el("span", { class: "stat" }, stat(file.added, file.removed)),
		),
	);
	const render = () => {
		if (details.childElementCount > 1) return;
		if (file.reason !== undefined) return details.append(el("div", { class: "aside" }, file.reason));
		const notesAt = new Map();
		for (const note of file.notes) notesAt.set(note.row, [...(notesAt.get(note.row) || []), note]);
		let chunk = el("div", { class: "diff" });
		details.append(chunk);
		file.rows.forEach((row, index) => {
			const notes = notesAt.get(index);
			chunk.append(rowView(row, notes !== undefined));
			if (notes === undefined) return;
			for (const note of notes) details.append(noteView(note));
			chunk = el("div", { class: "diff" });
			details.append(chunk);
		});
		if (chunk.childElementCount === 0) chunk.remove();
		if (file.more > 0) details.append(el("div", { class: "aside" }, `truncated, ${count(file.more, "more line")}`));
	};
	details.addEventListener("toggle", () => {
		if (details.open) render();
	});
	return {
		details,
		open() {
			render();
			details.open = true;
		},
	};
}

const MARKS = { add: "+", del: "-", context: " " };

function rowView(row, noted) {
	if (row.kind === "gap") return el("div", { class: "row gap" }, el("span", { class: "code" }, `\u22ef ${count(row.hidden, "line")} not shown`));
	if (row.kind === "hunk") return el("div", { class: "row hunk" }, el("span", { class: "code" }, row.text));
	return el(
		"div",
		{ class: `row ${row.kind}${noted ? " noted" : ""}` },
		el("span", { class: "ln" }, row.oldNo === undefined ? "" : row.oldNo),
		el("span", { class: "ln" }, row.newNo === undefined ? "" : row.newNo),
		el("span", { class: "code" }, MARKS[row.kind] + row.text),
	);
}

// Backticks mark inline code in a comment, as in markdown; everything goes in as text.
function richText(text) {
	return text.split("`").map((part, index) => (index % 2 === 1 ? el("code", {}, part) : part));
}

function noteView(note) {
	return el(
		"div",
		{ class: "note-box", id: `note-${note.index + 1}` },
		el("div", { class: "note-label" }, `note \u00b7 ${note.side} line ${note.line}`),
		el("p", {}, richText(note.comment)),
		note.cites.length > 0 ? el("div", { class: "cites" }, "Sources:", note.cites.map(citeView)) : "",
	);
}

function decisions() {
	const list = document.getElementById("decisions");
	if (quiz.decisions.length === 0) list.append(el("li", { class: "aside" }, "No decisions in this range."));
	quiz.decisions.forEach((decision, index) => {
		list.append(el("li", { class: "card decision", id: `decision-${index + 1}` }, el("strong", {}, decision.title), el("span", {}, decision.summary)));
	});
}

function flash(node) {
	// An instant jump: the page can be megabytes of diff, and a smooth scroll that long loses the reader.
	node.scrollIntoView({ block: "center" });
	node.classList.add("flash");
	setTimeout(() => node.classList.remove("flash"), 1600);
}

function reveal(target) {
	const row = document.getElementById(target);
	if (row === null) return;
	const view = commitViews.find((each) => each.row === row);
	if (view !== undefined) setOpen(view, true);
	flash(row);
}

function revealNote(index) {
	const home = noteHomes.get(index);
	setOpen(home.view, true);
	home.view.fileViews.get(home.fileIndex).open();
	flash(document.getElementById(`note-${index + 1}`));
}

function citeView(cite) {
	const link = (href, text, go) =>
		el("a", {
			href,
			onclick: (event) => {
				event.preventDefault();
				go();
			},
		}, text);
	switch (cite.kind) {
		case "commit":
			return link(`#commit-${shortSha(cite.sha)}`, shortSha(cite.sha), () => reveal(`commit-${shortSha(cite.sha)}`));
		case "decision":
			return link(`#decision-${cite.index + 1}`, cite.text, () => reveal(`decision-${cite.index + 1}`));
		case "note":
			return link(`#note-${cite.index + 1}`, cite.text, () => revealNote(cite.index));
		default:
			return el("code", {}, cite.text);
	}
}

const cards = [];

function questions() {
	const form = document.getElementById("questions");
	quiz.questions.forEach((question, index) => {
		const options = el("div", { class: "options" });
		const labels = question.options.map((option, value) =>
			el("label", { class: "option" }, el("input", { type: "radio", name: `q${index + 1}`, value, onchange: progress }), el("span", {}, option)),
		);
		options.append(...labels);
		const feedback = el("div", { class: "feedback", hidden: true });
		const card = el(
			"fieldset",
			{ class: "card question", id: `q-${index + 1}` },
			el("legend", {}, el("span", {}, `Question ${index + 1} of ${quiz.questions.length}`), el("span", { class: "tag" }, question.category)),
			el("p", { class: "prompt" }, question.question),
			options,
			feedback,
		);
		cards.push({ question, card, options, labels, feedback });
		form.append(card);
	});
}

function chosen(entry) {
	const input = entry.card.querySelector("input:checked");
	return input === null ? undefined : Number(input.value);
}

function progress() {
	const answered = cards.filter((entry) => chosen(entry) !== undefined).length;
	document.getElementById("progress").textContent = `${answered} of ${cards.length} answered`;
}

function submit() {
	const outcomes = cards.map((entry, index) => {
		const answer = chosen(entry);
		const right = answer === entry.question.correct;
		entry.card.classList.add("scored");
		entry.labels.forEach((label, value) => {
			label.querySelector("input").disabled = true;
			label.classList.toggle("is-correct", value === entry.question.correct);
			label.classList.toggle("is-wrong", value === answer && !right);
		});
		const correctText = entry.question.options[entry.question.correct];
		const verdict = right ? "Correct." : answer === undefined ? "Not answered, so it counts as wrong." : "Wrong.";
		entry.feedback.replaceChildren(
			el("p", {}, el("span", { class: "verdict" }, verdict), right ? "" : ` The answer is: ${correctText}`),
			el("p", {}, entry.question.explanation),
			el("div", { class: "cites" }, "Sources:", entry.question.cites.map(citeView)),
		);
		entry.feedback.className = `feedback ${right ? "good" : "bad"}`;
		entry.feedback.hidden = false;
		return { index, entry, answer, right };
	});
	results(outcomes);
	document.getElementById("submit").hidden = true;
	document.getElementById("retake").hidden = false;
	document.getElementById("progress").textContent = "";
}

function results(outcomes) {
	const score = outcomes.filter((outcome) => outcome.right).length;
	const [, grade, line] = GRADES.find(([floor]) => score >= floor);
	const missed = outcomes.filter((outcome) => !outcome.right);
	const box = document.getElementById("results");
	const board = el("div", { class: "board" }, outcomes.map((outcome) =>
		el("a", {
			href: `#q-${outcome.index + 1}`,
			class: outcome.right ? "right" : "wrong",
			title: outcome.right ? "right" : outcome.answer === undefined ? "not answered" : "wrong",
		}, `${outcome.index + 1}`),
	));
	const children = [el("p", { class: "score" }, `Score: ${score}/${outcomes.length} \u2014 ${grade}`), el("p", { class: "grade-line" }, line), board];
	if (missed.length > 0) {
		const weak = {};
		for (const outcome of missed) weak[outcome.entry.question.category] = (weak[outcome.entry.question.category] || 0) + 1;
		children.push(
			el("p", { class: "weak" }, "Weak spots: ", Object.entries(weak).sort((a, b) => b[1] - a[1]).map(([category, n]) => `${category} (${n})`).join(", ")),
			el("div", { class: "review" },
				el("h3", {}, "Incorrect answers \u2014 review these"),
				el("ol", {}, missed.map((outcome) => {
					const question = outcome.entry.question;
					return el("li", { value: outcome.index + 1 },
						el("p", {}, el("a", { href: `#q-${outcome.index + 1}` }, question.question)),
						el("p", {}, outcome.answer === undefined ? "Not answered." : `Your answer: ${question.options[outcome.answer]}`),
						el("p", {}, `Correct answer: ${question.options[question.correct]}`),
						el("p", {}, question.explanation),
						el("div", { class: "cites" }, "Sources:", question.cites.map(citeView)),
					);
				})),
			),
		);
	}
	box.replaceChildren(...children);
	box.hidden = false;
	box.scrollIntoView({ behavior: "smooth", block: "start" });
}

function retake() {
	for (const entry of cards) {
		entry.card.classList.remove("scored");
		entry.feedback.hidden = true;
		const order = entry.labels.map((_, value) => value);
		for (let index = order.length - 1; index > 0; index--) {
			const other = Math.floor(Math.random() * (index + 1));
			[order[index], order[other]] = [order[other], order[index]];
		}
		entry.options.replaceChildren(...order.map((value) => entry.labels[value]));
		for (const label of entry.labels) {
			const input = label.querySelector("input");
			input.checked = false;
			input.disabled = false;
			label.classList.remove("is-correct", "is-wrong");
		}
	}
	document.getElementById("results").hidden = true;
	document.getElementById("submit").hidden = false;
	document.getElementById("retake").hidden = true;
	progress();
	document.getElementById("questions-title").scrollIntoView({ behavior: "smooth", block: "start" });
}

header();
commits();
decisions();
questions();
progress();
document.getElementById("submit").addEventListener("click", submit);
document.getElementById("retake").addEventListener("click", retake);
</script>
</body>
