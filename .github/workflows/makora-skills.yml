name: makora-skills

on:
  pull_request:
    paths:
      - 'apps/makora/**'
      - '.github/workflows/makora-skills.yml'
  push:
    branches: [main]
    paths:
      - 'apps/makora/**'
      - '.github/workflows/makora-skills.yml'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: makora-skills-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check generated skills
        run: node apps/makora/scripts/sync-skills.mjs --check

  # Repins upstream and opens a PR. A PR opened with GITHUB_TOKEN does not trigger CI, so the push and the PR use
  # MAKORA_BOT_TOKEN (a PAT or GitHub App token with contents and pull-requests write on this repository).
  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BRANCH: bot/sync-skills
    steps:
      - name: Require MAKORA_BOT_TOKEN
        env:
          MAKORA_BOT_TOKEN: ${{ secrets.MAKORA_BOT_TOKEN }}
        run: |
          if [ -z "$MAKORA_BOT_TOKEN" ]; then
            echo "::error::Secret MAKORA_BOT_TOKEN is missing. Add a PAT or GitHub App token with contents and pull-requests write access; PRs opened with GITHUB_TOKEN do not trigger CI."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.MAKORA_BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Repin and regenerate
        run: node apps/makora/scripts/sync-skills.mjs --latest

      - name: Check the regenerated tree
        run: node apps/makora/scripts/sync-skills.mjs --check

      - name: Open or update the sync PR
        env:
          GH_TOKEN: ${{ secrets.MAKORA_BOT_TOKEN }}
        run: |
          git add -- apps/makora/skills apps/makora/skills.lock.json
          if git diff --cached --quiet; then
            echo "Skills are up to date."
            exit 0
          fi
          plugins=$(node -p 'require("./apps/makora/skills.lock.json").sources["cursor-plugins"].commit.slice(0, 7)')
          pstack=$(node -p 'require("./apps/makora/skills.lock.json").sources["cursor-plugins"].pstackVersion')
          nm=$(node -p 'require("./apps/makora/skills.lock.json").sources["no-mistakes"].tag')
          title="chore(makora): sync skills to pstack ${pstack} (cursor/plugins@${plugins}), no-mistakes ${nm}"
          body="Generated by \`node apps/makora/scripts/sync-skills.mjs --latest\` in the makora-skills workflow. Review the adapter rows for new upstream terms before merging."
          git config user.name "makora-bot"
          git config user.email "makora-bot@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -m "$title"
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          else
            gh pr create --head "$BRANCH" --base main --title "$title" --body "$body"
          fi
