# Generates and validates the model catalog; pi.dev publishes upstream's catalog, this repository only checks it.
name: Model Catalog

on:
  pull_request:
    paths:
      - '.github/workflows/publish-model-catalog.yml'
      - '.gitignore'
      - 'package.json'
      - 'packages/ai/**'
      - 'scripts/check-model-catalog-compat.mjs'
      - 'scripts/model-catalog-minimum-version.mjs'
      - 'scripts/model-catalog-protocol.ts'
      - 'scripts/publish-model-catalog.mjs'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit, branch, or tag to generate from'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ inputs.source_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
          # The compatibility check reads the latest release's source from its git tag.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate model catalog JSON
        run: npm run generate:model-catalog

      - name: Validate model catalog JSON
        run: npm run check:model-catalog

      # pi.dev serves the catalog to released pi >= MINIMUM_PI_VERSION; the latest release's code must handle it.
      - name: Check the model catalog against the latest release
        run: npm run check:model-catalog-compat
